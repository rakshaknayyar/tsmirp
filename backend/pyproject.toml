[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsmirp-backend"
version = "0.1.0"
description = "TSMIRP API - tourist safety decision-support prototype (SIH25002)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F = errors, I = import sorting, B = common bugs, UP = modern Python syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends(...) in a parameter default is the intended FastAPI pattern.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
# Our backend/alembic/ folder holds migrations; the `alembic` import is the installed library.
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60  # seconds per test; a stuck WebSocket test fails instead of hanging forever
